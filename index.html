<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends Chat - Real-Time Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b141a;
      color: #e9edef;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Auth Screen */
    .auth-container {
      width: 100%;
      max-width: 420px;
      background-color: #111b21;
      border: 1px solid #222d34;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      background: #00a884;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 0 16px rgba(0, 168, 132, 0.3);
    }

    .brand-logo svg {
      width: 28px;
      height: 28px;
      fill: #111b21;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      color: #e9edef;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #8696a0;
      margin-top: 4px;
    }

    .tab-nav {
      display: flex;
      background-color: #202c33;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #8696a0;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: #00a884;
      color: #111b21;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #8696a0;
      font-weight: 600;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      background-color: #202c33;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #e9edef;
      font-size: 14px;
      outline: none;
      transition: border 0.2s ease;
    }

    .input-field:focus {
      border-color: #00a884;
    }

    .handle-preview {
      font-size: 12px;
      color: #00a884;
      margin-top: 4px;
      font-weight: 500;
      min-height: 18px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #00a884;
      color: #111b21;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #029071;
    }

    .status-msg {
      font-size: 13px;
      text-align: center;
      margin-top: 8px;
      min-height: 20px;
    }

    .status-msg.error { color: #f15c6d; }
    .status-msg.success { color: #00a884; }

    /* Dashboard Layout */
    .dashboard-container {
      display: none;
      width: 100vw;
      height: 100vh;
      background-color: #111b21;
    }

    .app-layout {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Sidebar */
    .sidebar {
      width: 360px;
      background-color: #111b21;
      border-right: 1px solid #222d34;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      height: 60px;
      background-color: #202c33;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background-color: #00a884;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #111b21;
      font-size: 16px;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
      color: #e9edef;
    }

    .user-handle {
      font-size: 12px;
      color: #00a884;
    }

    .btn-logout {
      background: transparent;
      border: none;
      color: #8696a0;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-logout:hover { color: #f15c6d; }

    .search-box-container {
      padding: 10px 16px;
      background-color: #111b21;
      border-bottom: 1px solid #222d34;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      background-color: #202c33;
      border: none;
      border-radius: 8px;
      color: #e9edef;
      font-size: 13px;
      outline: none;
    }

    .contacts-list {
      flex: 1;
      overflow-y: auto;
    }

    .contact-item {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid #222d34;
      transition: background 0.15s;
    }

    .contact-item:hover {
      background-color: #202c33;
    }

    .contact-item.active {
      background-color: #2a3942;
    }

    .contact-details h4 {
      font-size: 15px;
      color: #e9edef;
    }

    .contact-details p {
      font-size: 12px;
      color: #8696a0;
      margin-top: 2px;
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      background-color: #0b141a;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      height: 60px;
      background-color: #202c33;
      padding: 0 20px;
      display: flex;
      align-items: center;
      font-weight: 600;
      color: #e9edef;
      border-bottom: 1px solid #222d34;
    }

    .messages-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-image: radial-gradient(#1f2c34 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .message-bubble {
      max-width: 60%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message-bubble.incoming {
      background-color: #202c33;
      color: #e9edef;
      align-self: flex-start;
      border-top-left-radius: 0;
    }

    .message-bubble.outgoing {
      background-color: #005c4b;
      color: #e9edef;
      align-self: flex-end;
      border-top-right-radius: 0;
    }

    .chat-input-footer {
      padding: 12px 20px;
      background-color: #202c33;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      background-color: #2a3942;
      border: none;
      border-radius: 8px;
      color: #e9edef;
      font-size: 14px;
      outline: none;
    }

    .btn-send {
      background: #00a884;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-send:hover { background: #029071; }
    .btn-send svg { width: 20px; height: 20px; fill: #111b21; }

    .empty-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8696a0;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="auth-container">
    <div class="brand-header">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </div>
      <h1 class="brand-title">Friends Chat</h1>
      <p class="brand-subtitle">Private Messaging Platform</p>
    </div>

    <div class="tab-nav">
      <button id="tabSignIn" class="tab-btn active" onclick="switchTab('signin')">Sign In</button>
      <button id="tabSignUp" class="tab-btn" onclick="switchTab('signup')">Create Account</button>
    </div>

    <form id="signInForm" class="auth-form" onsubmit="handleSignIn(event)">
      <div class="input-group">
        <label for="loginHandle">Your Unique Handle</label>
        <input type="text" id="loginHandle" class="input-field" placeholder="e.g. Yassin_362735" required>
      </div>
      <div class="input-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="input-field" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <form id="signUpForm" class="auth-form" style="display: none;" onsubmit="handleSignUp(event)">
      <div class="input-group">
        <label for="regName">Display Name</label>
        <input type="text" id="regName" class="input-field" placeholder="e.g. Yassin Koshari" oninput="updateHandlePreview(this.value)" required>
        <div id="handlePreview" class="handle-preview">Your handle will look like: @Name_123456</div>
      </div>
      <div class="input-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" class="input-field" placeholder="••••••••" required minlength="6">
      </div>
      <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashScreen" class="dashboard-container">
    <div class="app-layout">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="user-badge">
            <div id="userAvatar" class="avatar">Y</div>
            <div class="user-info">
              <span id="userNameDisplay" class="user-name">User</span>
              <span id="userHandleDisplay" class="user-handle">@Handle</span>
            </div>
          </div>
          <button class="btn-logout" onclick="handleLogOut()">Sign Out</button>
        </div>

        <div class="search-box-container">
          <input type="text" id="searchHandleInput" class="search-input" placeholder="Search handle (e.g. Asser_123456)..." onkeyup="searchUsers(event)">
        </div>

        <div id="contactsList" class="contacts-list">
          <div style="padding: 20px; text-align: center; color: #8696a0; font-size: 13px;">
            Search for a friend's handle above to chat!
          </div>
        </div>
      </div>

      <!-- CHAT WINDOW -->
      <div class="chat-area" id="chatArea">
        <div class="empty-chat">
          <h2>Welcome to Friends Chat</h2>
          <p style="margin-top: 6px;">Select or search a contact from the sidebar to start messaging.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- FIREBASE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      collection, 
      query, 
      where, 
      getDocs,
      addDoc,
      onSnapshot,
      orderBy,
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "relay-8856b.firebaseapp.com",
      projectId: "relay-8856b",
      storageBucket: "relay-8856b.firebasestorage.app",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let generatedHandle = "";
    let activeChatUser = null;
    let unsubscribeMessages = null;

    window.switchTab = function(type) {
      document.getElementById('signInForm').style.display = type === 'signin' ? 'flex' : 'none';
      document.getElementById('signUpForm').style.display = type === 'signup' ? 'flex' : 'none';
      document.getElementById('tabSignIn').classList.toggle('active', type === 'signin');
      document.getElementById('tabSignUp').classList.toggle('active', type === 'signup');
      document.getElementById('statusMsg').textContent = "";
    };

    window.updateHandlePreview = function(nameVal) {
      const previewDiv = document.getElementById('handlePreview');
      const cleanName = nameVal.trim().split(' ')[0].replace(/[^a-zA-Z0-9]/g, '');
      if (!cleanName) {
        previewDiv.textContent = "Your handle will look like: @Name_123456";
        generatedHandle = "";
        return;
      }
      if (!window.currentRandomSuffix) {
        window.currentRandomSuffix = Math.floor(100000 + Math.random() * 900000);
      }
      generatedHandle = `${cleanName}_${window.currentRandomSuffix}`;
      previewDiv.textContent = `Your handle will be: @${generatedHandle}`;
    };

    window.handleSignUp = async function(e) {
      e.preventDefault();
      const nameVal = document.getElementById('regName').value.trim();
      const passwordVal = document.getElementById('regPassword').value;
      const statusMsg = document.getElementById('statusMsg');

      if (!generatedHandle) {
        statusMsg.className = "status-msg error";
        statusMsg.textContent = "Please enter a valid display name.";
        return;
      }

      try {
        const internalEmail = `${generatedHandle.toLowerCase()}@friendschat.app`;
        const userCred = await createUserWithEmailAndPassword(auth, internalEmail, passwordVal);
        await setDoc(doc(db, "users", userCred.user.uid), {
          uid: userCred.user.uid,
          displayName: nameVal,
          handle: generatedHandle,
          searchHandle: generatedHandle.toLowerCase()
        });
      } catch (err) {
        statusMsg.className = "status-msg error";
        statusMsg.textContent = err.message.replace("Firebase: ", "");
      }
    };

    window.handleSignIn = async function(e) {
      e.preventDefault();
      const handleVal = document.getElementById('loginHandle').value.trim().replace('@', '');
      const statusMsg = document.getElementById('statusMsg');
      try {
        await signInWithEmailAndPassword(auth, `${handleVal.toLowerCase()}@friendschat.app`, document.getElementById('loginPassword').value);
      } catch (err) {
        statusMsg.className = "status-msg error";
        statusMsg.textContent = "Invalid handle or password.";
      }
    };

    window.handleLogOut = () => signOut(auth);

    window.searchUsers = async function(e) {
      const queryVal = e.target.value.trim().toLowerCase().replace('@', '');
      const contactsList = document.getElementById('contactsList');

      if (queryVal.length < 2) {
        contactsList.innerHTML = `<div style="padding: 20px; text-align: center; color: #8696a0; font-size: 13px;">Type at least 2 characters to search handle...</div>`;
        return;
      }

      const q = query(collection(db, "users"), where("searchHandle", ">=", queryVal), where("searchHandle", "<=", queryVal + '\uf8ff'));
      const snapshot = await getDocs(q);

      contactsList.innerHTML = "";
      if (snapshot.empty) {
        contactsList.innerHTML = `<div style="padding: 20px; text-align: center; color: #8696a0; font-size: 13px;">No users found.</div>`;
        return;
      }

      snapshot.forEach(docSnap => {
        const userData = docSnap.data();
        if (userData.uid === currentUser.uid) return;

        const item = document.createElement('div');
        item.className = 'contact-item';
        item.innerHTML = `
          <div class="avatar">${userData.displayName.charAt(0).toUpperCase()}</div>
          <div class="contact-details">
            <h4>${userData.displayName}</h4>
            <p>@${userData.handle}</p>
          </div>
        `;
        item.onclick = () => openChat(userData);
        contactsList.appendChild(item);
      });
    };

    function openChat(user) {
      activeChatUser = user;
      if (unsubscribeMessages) unsubscribeMessages();

      const chatArea = document.getElementById('chatArea');
      chatArea.innerHTML = `
        <div class="chat-header"><span>Chat with ${user.displayName} (@${user.handle})</span></div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="chat-input-footer">
          <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." onkeypress="checkSend(event)">
          <button class="btn-send" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      `;

      const chatId = [currentUser.uid, user.uid].sort().join('_');
      const msgRef = collection(db, "chats", chatId, "messages");
      const q = query(msgRef, orderBy("createdAt", "asc"));

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        const container = document.getElementById('messagesContainer');
        if (!container) return;
        container.innerHTML = "";
        snapshot.forEach(docSnap => {
          const msg = docSnap.data();
          const bubble = document.createElement('div');
          bubble.className = `message-bubble ${msg.senderId === currentUser.uid ? 'outgoing' : 'incoming'}`;
          bubble.textContent = msg.text;
          container.appendChild(bubble);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    window.checkSend = function(e) {
      if (e.key === 'Enter') sendMessage();
    };

    window.sendMessage = async function() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !activeChatUser) return;

      const chatId = [currentUser.uid, activeChatUser.uid].sort().join('_');
      input.value = "";

      await addDoc(collection(db, "chats", chatId, "messages"), {
        text: text,
        senderId: currentUser.uid,
        createdAt: serverTimestamp()
      });
    };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          const data = userDoc.data();
          document.getElementById('userNameDisplay').textContent = data.displayName;
          document.getElementById('userHandleDisplay').textContent = `@${data.handle}`;
          document.getElementById('userAvatar').textContent = data.displayName.charAt(0).toUpperCase();
        }
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('dashScreen').style.display = 'block';
      } else {
        currentUser = null;
        document.getElementById('authScreen').style.display = 'block';
        document.getElementById('dashScreen').style.display = 'none';
      }
    });
  </script>
</body>
</html>
